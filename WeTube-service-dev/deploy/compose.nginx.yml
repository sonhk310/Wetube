services:
  backend:
    image: ${IMAGE_NAME_BACKEND}:${IMAGE_TAG_BACKEND}
    container_name: wetube-backend-container
    env_file: .env
    restart: always
    networks:
      - web-network

  frontend:
    image: ${IMAGE_NAME_FRONTEND}:${IMAGE_TAG_FRONTEND}
    container_name: wetube-frontend-container
    env_file: .env
    restart: always
    networks:
      - web-network

  nginx:
    image: nginx:latest
    container_name: wetube-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - web-network

networks:
  web-network:
    driver: bridge