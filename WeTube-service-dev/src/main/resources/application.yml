spring:
  application:
    name: WeTube-service
  profiles:
    default: local

  main:
    allow-bean-definition-overriding: true

  web:
    cors:
      allowed-origins: "https://wetube.name.vn"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  elasticsearch:
    uris: ${ELASTICSEARCH_URL}
    username: ${ELASTIC_USERNAME:}
    password: ${ELASTIC_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 10s

  # Redis chỉ dùng làm cache/bộ đếm. Thiếu REDIS_URL thì không kết nối; Redis lỗi thì app vẫn chạy (xem RedisServiceImpl).
  # Mặc định localhost chỉ để Spring Boot không lỗi khi đọc URL rỗng, không được dùng tới.
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s
      connect-timeout: 2s
      repositories:
        enabled: false

  # Giữ cache Spring trong bộ nhớ, không tự chuyển sang Redis khi có thư viện Redis
  cache:
    type: simple

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 120MB

app:
  data:
    auto-import: false
  jwt:
    issuer: "oauth2-service-v2"
    access-token-ttl-hour: 1
    refresh-token-ttl-days: 14
    # Prod: set JWT_PRIVATE_KEY / JWT_PUBLIC_KEY. The PEM files are for local dev only (not in git).
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-pem: "classpath:keys/private_key.pem"
    public-key-pem: "classpath:keys/public_key.pem"

geoip:
  database: classpath:GeoLite/GeoLite2-Country.mmdb

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
debug: false

myapp:
  recommendation:
    pool-size: 200

