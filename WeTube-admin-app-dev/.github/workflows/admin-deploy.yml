name: CI/CD pipeline for WeTube Admin App

on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Build Admin App Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wetube-admin-app:${{ github.sha }}

  deploy:
    name: Deploy Admin App to EC2
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment directory on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            mkdir -p wetube-admin-deploy

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "compose.yml"
          target: "wetube-admin-deploy"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd wetube-admin-deploy

            echo "Creating .env file..."
            cat > .env << EOF
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wetube-admin-app
            IMAGE_TAG=${{ github.sha }}
            EOF

            # Login to Docker Hub on EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling latest image and restarting service..."
            sudo docker-compose pull
            sudo docker-compose up -d --remove-orphans

            echo "Admin app deployment complete!"
